[package]
name = "planr"
version = "0.3.1"
edition = "2021"
description = "planr -- trunk-based, markdown-formatted backlog for both solo and concurrent development"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unprofessor/planr-rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tgz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
lto = true
strip = true

# `serve` is on by default: the browser view is part of what planr is for, and
# a default-off feature is a feature nobody has. `--no-default-features`
# builds the CLI alone, without tiny_http or pulldown-cmark -- keep the cfgs
# tight enough that it still compiles, which the CI `check-no-default` job is
# there to prove.
[features]
default = ["serve"]
serve = ["dep:tiny_http", "dep:pulldown-cmark"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
regex = "1"
fs2 = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }
# tiny_http -- blocking HTTP/1.1 for `planr serve`. Four leaf dependencies
# against an async stack's eighty, for a loopback server with no concurrency
# story worth the difference.
tiny_http = { version = "0.12", optional = true }
# pulldown-cmark -- CommonMark for the ticket body. `default-features = false`
# drops the bundled binary's getopts/unicode-width; `html` is the renderer.
pulldown-cmark = { version = "0.13", optional = true, default-features = false, features = [
  "html",
] }

[build-dependencies]
# semvertag-shell -- derive a SemVer version from git describe at build time
semvertag-shell = "0.2"

[dev-dependencies]
# assert_cmd & tempfile -- end-to-end CLI tests in throwaway git repos
assert_cmd = "2"
# boon & serde_json -- validate the published planr schema and its fixtures
boon = "0.6.1"
serde_json = "1.0.151"
tempfile = "3"
