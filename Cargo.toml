[package]
name = "planr"
version = "0.3.0"
edition = "2021"
description = "planr -- trunk-based, markdown-formatted backlog for both solo and concurrent development"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unprofessor/planr-rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
lto = true
strip = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
regex = "1"
fs2 = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[build-dependencies]
# semvertag-shell -- derive a SemVer version from git describe at build time
semvertag-shell = "0.2"

[dev-dependencies]
# assert_cmd & tempfile -- end-to-end CLI tests in throwaway git repos
assert_cmd = "2"
tempfile = "3"
