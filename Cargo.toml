[package]
name = "planr"
version = "0.2.0"
edition = "2021"
description = "planr -- trunk-based, markdown-formatted backlog for both solo and concurrent development"

[profile.release]
lto = true
strip = true

# --- why each dependency? ---
# clap (derive)  -- arg parsing + --help + --version
# serde_yaml     -- YAML frontmatter parser; plain scalars, inline & block lists,
#                  quoted strings, null -- same subset eemeli/yaml handles in TS.
#                  Works via serde_yaml::Value which maps straight from
#                  Record<string, unknown> used in the TypeScript port.
# regex          -- wiki-link extraction, slug validation, filename matching
# fs2            -- flock (lock_shared / lock_exclusive) on <git-common-dir>/planr.lock
# jiff           -- civil date formatting (YYYY-MM-DD) with UTC/local offset

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
regex = "1"
fs2 = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[build-dependencies]
# semvertag-shell -- derive a SemVer version from git describe at build time
semvertag-shell = "0.2"

[dev-dependencies]
# assert_cmd & tempfile -- end-to-end CLI tests in throwaway git repos
assert_cmd = "2"
tempfile = "3"
